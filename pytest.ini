[tool:pytest]
minversion = 7.0
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=esmd_shared
    --cov=bundlesubmissionclient
    --cov=documentrefscheduler
    --cov=notificationscheduler
    --cov=practitionerclient
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
testpaths = 
    tests
python_files = 
    test_*.py
    *_test.py
python_classes = 
    Test*
python_functions = 
    test_*
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (skipped by default)
    network: Tests requiring network access
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning 